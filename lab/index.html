<style>
/* One screen: the bush is the page. Counts in dot numerals, words in a field-guide serif, ground = ripe-berry slate. */
:root{--night:#14191d;--ink:#fbfbf4;--dim:#a5aeb4;--faint:#788492;--line:rgba(165,174,180,.22);
 --unripe:hsl(97 55% 62%);--mid:hsl(338 58% 64%);--ripe:hsl(220 60% 66%);
 --dot:"Doto",ui-monospace,monospace;--book:"Literata",Georgia,serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--book);overflow:hidden}
.app{position:relative;height:100%;width:100%}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;transition:opacity .35s}
#gl.out{opacity:0}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 45%,transparent 52%,rgba(6,8,9,.6))}
.mark{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:max(22px,env(safe-area-inset-left,0px));font-family:var(--dot);font-weight:700;font-size:21px;font-variation-settings:"ROND" 100}
.load{position:absolute;inset:0;display:grid;place-items:center;font-style:italic;color:var(--dim);pointer-events:none}
.count{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 170px);pointer-events:none}
.num{font-family:var(--dot);font-weight:800;font-size:clamp(80px,14vw,180px);line-height:.84;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-variation-settings:"ROND" var(--rond,100);transition:opacity .4s}
.num.idle{opacity:.16}
.what{font-style:italic;font-size:19px;color:var(--dim);margin-top:4px}
.split{display:flex;gap:22px;margin-top:12px}
.split div{opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
.split.on div{opacity:1;transform:none}.split.on div:nth-child(2){transition-delay:.1s}.split.on div:nth-child(3){transition-delay:.2s}
.split b{display:block;font-family:var(--dot);font-weight:800;font-size:44px;line-height:.9;font-variation-settings:"ROND" 100}
.split span{font-size:14px;font-style:italic;color:var(--dim)}
.split i{display:block;width:34px;height:3px;margin-bottom:8px}

/* mode bar */
.modes{position:absolute;left:max(22px,env(safe-area-inset-left,0px));right:max(22px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 100px);display:flex;gap:6px;flex-wrap:wrap}
.modes button{font-family:var(--book);font-size:16px;border:1px solid var(--line);background:rgba(20,25,29,.55);color:var(--dim);padding:10px 16px;cursor:pointer;transition:color .2s,border-color .2s,background .2s;backdrop-filter:blur(6px)}
.modes button:hover{color:var(--ink);border-color:var(--dim)}
.modes button[aria-pressed="true"]{color:var(--night);background:var(--ink);border-color:var(--ink)}
.modes button:focus-visible,.strip button:focus-visible,.panel button:focus-visible{outline:2px solid var(--dim);outline-offset:3px}
.strip{position:absolute;left:0;right:0;bottom:0;padding:12px max(22px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(22px,env(safe-area-inset-left,0px));display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.strip::-webkit-scrollbar{display:none}
.strip button{all:unset;cursor:pointer;flex:0 0 auto;padding:6px 0;font-size:15px;color:var(--faint);border-bottom:2px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap}
.strip button:hover{color:var(--ink)}
.strip button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.strip button small{font-style:italic;color:var(--faint);margin-left:6px}

/* shelf: every capture as its real thumbnail, ordered by date; only the count and the date */
.shelf{position:absolute;left:0;right:0;bottom:0;padding:10px max(22px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(22px,env(safe-area-inset-left,0px));display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);background:linear-gradient(transparent,rgba(10,13,15,.75) 40%)}
.shelf::-webkit-scrollbar{display:none}
.shelf button{all:unset;cursor:pointer;flex:0 0 auto;display:grid;grid-template-columns:44px auto;gap:2px 10px;align-items:center;padding:6px 12px 6px 6px;opacity:.5;transition:opacity .2s;border-bottom:2px solid transparent}
.shelf button:hover{opacity:.85}
.shelf button[aria-pressed="true"]{opacity:1;border-color:var(--ink)}
.shelf button:focus-visible{outline:2px solid var(--dim)}
.shelf img{grid-row:1 / 3;width:44px;height:60px;object-fit:cover;display:block;background:#0e1215}
.shelf b{font-family:var(--dot);font-weight:800;font-size:26px;line-height:.9;font-variation-settings:"ROND" 100;align-self:end}
.shelf span{font-style:italic;font-size:13px;color:var(--dim);align-self:start}
.shelf .gap{flex:0 0 1px;background:var(--line);margin:8px 10px}
/* cluster panel */
.panel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);right:max(22px,env(safe-area-inset-right,0px));width:min(320px,calc(100vw - 44px));display:grid;gap:14px;opacity:0;transform:translateX(12px);transition:opacity .4s,transform .4s;pointer-events:none}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.panel h3{margin:0;font-weight:400;font-size:24px;line-height:1.1}
.panel .big{font-family:var(--dot);font-weight:800;font-size:72px;line-height:.85;font-variation-settings:"ROND" 100}
.panel .unit{font-style:italic;color:var(--dim);font-size:16px}
.rows{display:grid;gap:7px;border-top:1px solid var(--line);padding-top:12px}
.rows div{display:grid;grid-template-columns:1fr auto;gap:12px;font-size:15px;color:var(--dim)}
.rows b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.mix{display:flex;height:6px;gap:2px}
.mix i{display:block;height:100%}
.hist{display:flex;align-items:flex-end;gap:2px;height:64px;border-bottom:1px solid var(--line)}
.hist i{flex:1;background:var(--dim);min-height:1px;opacity:.75}
.hist i.on{background:var(--ink);opacity:1}
.histx{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);font-style:italic}
.nav{display:flex;gap:8px}
.nav button{font-family:var(--book);font-size:15px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer}
.nav button:hover{border-color:var(--dim)}
.note{font-size:13px;font-style:italic;color:var(--faint);line-height:1.4}
.tags span{position:absolute;transform:translate(-50%,0);text-align:center;white-space:nowrap;font-style:italic;font-size:15px;color:var(--dim);pointer-events:none;text-shadow:0 1px 8px #000}
.tags b{display:block;font-family:var(--dot);font-style:normal;font-weight:800;font-size:38px;color:var(--ink);font-variation-settings:"ROND" 100;line-height:1}
@media (max-width:700px){
 .panel{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 132px);right:auto;left:max(22px,env(safe-area-inset-left,0px));width:calc(100vw - 44px);background:rgba(20,25,29,.86);padding:14px;gap:10px}
 .panel.on ~ .count{opacity:0}
 .panel .big{font-size:52px}
 .count{bottom:calc(env(safe-area-inset-bottom,0px) + 136px)}
 .modes button{padding:8px 11px;font-size:14px}
}
</style>

<div class="app">
  <canvas id="gl" aria-label="A real blueberry bush rebuilt in 3D from a one-minute video. Drag to turn it; in Clusters, tap a cluster."></canvas>
  <div class="vignette"></div>
  <div class="tags" id="tags" aria-hidden="true"></div>

  <div class="modes" role="group" aria-label="View">
    <button type="button" data-m="whole" aria-pressed="true">Natural</button>

</div>

 document.getElementById('cPrev').onclick=function(){lab.focus(i-1);};
 document.getElementById('cNext').onclick=function(){lab.focus(i+1);};
 document.getElementById('cAll').onclick=function(){setMode('clusters');};
}
function setMode(m){
 mode=m;modeBtns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===m?'true':'false');});
 split.classList.remove('on');panel.classList.remove('on');
 if(m==='count'){setNum(0,true);lab.count();return;}
 setNum(meta?meta.total:0,m==='whole');
 if(m==='sorted'){lab.sort();showSplit();return;}
 if(m==='ripeness'){lab.mode(m);showSplit();return;}
 lab.mode(m);
 if(m==='clusters')overview();
}
modeBtns.forEach(function(b){b.addEventListener('click',function(){if(meta)setMode(b.dataset.m);});});

var strip=document.getElementById('strip'),btn=[],CAPS=[];
var cur=0,gl=document.getElementById('gl');
function pick(i){cur=i;
 btn.forEach(function(b,j){b.setAttribute('aria-pressed',j===i?'true':'false');});if(btn[i])btn[i].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
 gl.classList.add('out');
 load.hidden=false;setNum(0,true);split.classList.remove('on');panel.classList.remove('on');tags.innerHTML='';
 setTimeout(function(){lab.load('media/plants/'+CAPS[i].id+'/').then(function(m){if(!m)return;meta=m;load.hidden=true;gl.classList.remove('out');
  what.textContent=m.kind==='flowers'?'flowers':'berries';setNum(m.total,true);setMode(mode==='count'||mode==='sorted'?'whole':mode);})
 .catch(function(){load.textContent='The bush could not be loaded';});},350);
}
fetch('media/plants/index.json').then(function(r){return r.json();}).then(function(list){
 CAPS=list;var lastMon=null;list.forEach(function(c,i){var mon=c.date.split(' ')[1];if(lastMon&&mon!==lastMon){var g=document.createElement('i');g.className='gap';strip.appendChild(g);}lastMon=mon;
  var b=document.createElement('button');b.type='button';b.setAttribute('aria-label',c.date+', '+c.total+(c.kind==='flowers'?' flowers':' berries'));
  b.innerHTML='<img alt="" loading="lazy" src="media/plants/'+c.id+'/thumb.jpg"><b>'+c.total+'</b><span>'+c.date+'</span>';
  b.addEventListener('click',function(){pick(i);});strip.appendChild(b);btn.push(b);});
 document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'&&cur<CAPS.length-1)pick(cur+1);if(e.key==='ArrowLeft'&&cur>0)pick(cur-1);});
 var start=0,h=(location.hash||'').slice(1).toLowerCase();list.forEach(function(c,i){if(c.id.toLowerCase()===h)start=i;});
 if(!h){list.forEach(function(c,i){if(c.id==='Plant7_Jul1')start=i;});}
 pick(start);
});
})();
</script>
</body></html>
